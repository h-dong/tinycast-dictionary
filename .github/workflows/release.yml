name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Build dictd helper
        run: |
          swiftc -O -target arm64-apple-macosx13.0 -o dictd-arm64 helper/dictd.swift
          swiftc -O -target x86_64-apple-macosx13.0 -o dictd-x86_64 helper/dictd.swift
          lipo -create -output assets/dictd dictd-arm64 dictd-x86_64
          rm dictd-arm64 dictd-x86_64
          chmod +x assets/dictd
          file assets/dictd

      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org

      - name: Build extension
        run: npm run build

      - name: Pack release zip
        run: |
          staging="tinycast-dictionary"
          rm -rf "$staging" tinycast-dictionary.zip
          mkdir "$staging"
          cp -R build/. "$staging/"
          # Drop source maps if ray emits any — Tinycast ignores them anyway.
          find "$staging" -name '*.js.map' -delete
          zip -r tinycast-dictionary.zip "$staging"
          ls -lh tinycast-dictionary.zip
          unzip -l tinycast-dictionary.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinycast-dictionary-zip
          path: tinycast-dictionary.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tinycast-dictionary-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: tinycast-dictionary.zip
          generate_release_notes: true
